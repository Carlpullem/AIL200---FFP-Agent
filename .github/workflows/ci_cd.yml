name: Gridiron Edge AI — AgentOps CI/CD & Golden Dataset Evaluation

# Manual trigger only (workflow_dispatch) — prevents automatic runs and email alerts on push
on:
  workflow_dispatch:

jobs:
  evaluate-and-verify-rubric:
    name: Run Golden Dataset Eval & 95-Point AgentOps Rubric Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Automated Evaluation & 19-Criterion Rubric Tests
        run: |
          python3 -m tests.test_agentops_rubric_and_eval

      - name: Validate ADK & agents-cli Evalset Schema
        run: |
          python3 -c "import json; data=json.load(open('eval/fantasy_edge.evalset.json')); assert 'eval_cases' in data"

