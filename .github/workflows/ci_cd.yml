name: Gridiron Edge AI — AgentOps CI/CD & Golden Dataset Evaluation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  evaluate-and-verify-rubric:
    name: Run Golden Dataset Eval & 95-Point AgentOps Rubric Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic pytest fastapi httpx opentelemetry-api opentelemetry-sdk

      - name: Run Automated Evaluation & 19-Criterion Rubric Tests
        run: |
          pytest -v tests/test_agentops_rubric_and_eval.py

      - name: Validate ADK & agents-cli Evalset Schema
        run: |
          python -c "import json; data=json.load(open('eval/fantasy_edge.evalset.json')); assert 'eval_cases' in data"

  terraform-iac-validation:
    name: Validate Terraform IaC
    runs-on: ubuntu-latest
    needs: evaluate-and-verify-rubric
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format & Init Check
        working-directory: ./terraform
        run: |
          terraform init -backend=false
          terraform validate
